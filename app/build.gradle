plugins {
    id 'com.android.application'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.hermescoagent.phone'
    compileSdk 34

    defaultConfig {
        applicationId "com.hermescoagent.phone"
        minSdk 24
        targetSdk 34
        versionCode 39
        versionName "4.8"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
